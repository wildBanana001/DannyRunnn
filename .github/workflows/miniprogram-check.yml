name: WeChat Mini Program CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker_house/src/**"
      - "worker_house/config/**"
      - "worker_house/package.json"
      - "worker_house/package-lock.json"
      - "worker_house/project.config.json"
      - "worker_house/tsconfig.json"
      - ".github/workflows/miniprogram-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechat-miniprogram-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build WeChat Mini Program
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker_house
    env:
      TARO_APP_API_MODE: mock
      TARO_APP_PAYMENT_API_MODE: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker_house/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build WeChat Mini Program
        run: npm run build:weapp
