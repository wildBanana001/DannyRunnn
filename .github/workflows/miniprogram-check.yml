name: WeChat Mini Program CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker_house/src/**"
      - "worker_house/config/**"
      - "worker_house/package.json"
      - "worker_house/package-lock.json"
      - "worker_house/project.config.json"
      - "worker_house/scripts/**"
      - "worker_house/tests/**"
      - "worker_house/tsconfig.json"
      - "worker_house/types/**"
      - ".github/workflows/miniprogram-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechat-miniprogram-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build WeChat Mini Program
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker_house
    env:
      # PR builds must exercise the same request path as the uploaded mini program.
      # Mock remains available for explicit local development only.
      TARO_APP_API_MODE: cloudrun
      TARO_APP_CLOUD_ENV_ID: prod-d9g991lo4dba5a4da
      TARO_APP_CLOUDRUN_SERVICE: worker-house-bff

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker_house/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build WeChat Mini Program
        run: npm run build:weapp

      - name: Verify production bundle excludes local business seeds
        run: npm run verify:production-bundle
